    <div class="app-container">

        <main class="main-container">
            <article class="page">
                <h1>Shaders</h1>
                <p class="lede">A shader is a small program that runs on the graphics card and works out the color of every pixel of a surface. Materials are shaders with sliders.</p>
                <p class="hint">Drag a model to turn it.</p>
                <div class="spread">
                    <figure class="panel" data-panel="normal-color">
                        <div class="view"></div>
                        <figcaption><b>Color from the normal</b>The simplest useful shader: turn each pixel's normal direction into a color.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="fresnel">
                        <div class="view"></div>
                        <figcaption><b>Fresnel rim</b>Brighter where the surface turns away from you, like a glowing edge. Used for force fields and outlines.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="toon">
                        <div class="view"></div>
                        <figcaption><b>Toon shading</b>Light is cut into three flat bands instead of a smooth gradient, for a cartoon look.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="stripes">
                        <div class="view"></div>
                        <figcaption><b>Procedural pattern</b>Stripes computed from the position and the time. No texture image is involved.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="waves">
                        <div class="view"></div>
                        <figcaption><b>Moving vertices</b>A vertex shader moves the surface itself. These waves are computed on the graphics card each frame.</figcaption>
                    </figure>
                </div>
