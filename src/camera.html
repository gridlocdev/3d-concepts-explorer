        <main class="main-container">
            <article class="page">
                <h1>Camera</h1>
                <p class="lede">The camera is the viewpoint the final image is rendered from. You can look around freely while you work, but only the camera's view ends up in the render.</p>
                <p class="hint">Drag a model to turn it.</p>
                <div class="spread">
                    <figure class="panel wide" data-panel="frustum">
                        <div class="view"></div>
                        <figcaption><b>The camera in the scene</b>The camera is an object with a viewing volume (the frustum). Only what is inside it renders.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="perspective">
                        <div class="view"></div>
                        <figcaption><b>Perspective</b>Far things look smaller and parallel lines meet in the distance, as in a photo.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="orthographic">
                        <div class="view"></div>
                        <figcaption><b>Orthographic</b>No perspective: size does not change with distance. Used for technical views and plans.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="wide">
                        <div class="view"></div>
                        <figcaption><b>18mm, wide</b>A short lens sees a wide angle. To fill the frame it stands close, and the pillars behind spread far apart.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="normal">
                        <div class="view"></div>
                        <figcaption><b>50mm, normal</b>Close to how our eyes see. Moderate depth.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="tele">
                        <div class="view"></div>
                        <figcaption><b>135mm, telephoto</b>A long lens from far away flattens depth: the pillars seem stacked right behind the subject.</figcaption>
                    </figure>
                </div>
