<body>
    <div class="app-container">
        <aside class="sidebar">
            <wiki-sidebar></wiki-sidebar>
        </aside>

        <main class="main-container">
            <article class="page">
                <h1>Lighting</h1>
                <p class="lede">A 3D scene starts dark. Lights make it visible, and their type, size and position set the mood.</p>
                <p class="hint">Drag a model to turn it.</p>
                <div class="spread">
                    <figure class="panel" data-panel="point">
                        <div class="view"></div>
                        <figcaption><b>Point</b>Shines in every direction from one spot, like a bare bulb, and fades with distance.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="directional">
                        <div class="view"></div>
                        <figcaption><b>Directional</b>Parallel rays from one direction, like the sun. Every shadow falls the same way.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="spot">
                        <div class="view"></div>
                        <figcaption><b>Spot</b>A cone of light, like a flashlight. You set the cone angle and how soft its edge is.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="hemisphere">
                        <div class="view"></div>
                        <figcaption><b>Hemisphere</b>Sky color from above, ground color from below, and no shadows. Often used as fill.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="hard">
                        <div class="view"></div>
                        <figcaption><b>Hard shadows</b>A small or distant light casts a crisp shadow edge.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="soft">
                        <div class="view"></div>
                        <figcaption><b>Soft shadows</b>A large light casts a soft edge, which is how most real light looks.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="key">
                        <div class="view"></div>
                        <figcaption><b>Key light</b>Three-point lighting starts with one main light from the side. Half the subject falls into shadow.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="fill">
                        <div class="view"></div>
                        <figcaption><b>+ Fill light</b>A weaker light from the other side lifts the shadows.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="rim">
                        <div class="view"></div>
                        <figcaption><b>+ Rim light</b>A light from behind outlines the edge and separates the subject from the background.</figcaption>
                    </figure>
                </div>
