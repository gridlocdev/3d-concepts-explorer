<body>
    <div class="app-container">
        <aside class="sidebar">
            <wiki-sidebar></wiki-sidebar>
        </aside>

        <main class="main-container">
            <article class="page">
                <h1>Meshes</h1>
                <p class="lede">Every 3D model is a mesh: points in space, joined by straight lines, filled in with flat surfaces.</p>
                <p class="hint">Drag a model to turn it.</p>
                <div class="spread">
                    <figure class="panel" data-panel="vertices">
                        <div class="view"></div>
                        <figcaption><b>Vertices</b>Points in 3D space, each with an X, Y and Z position. This house has 10.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="edges">
                        <div class="view"></div>
                        <figcaption><b>Edges</b>Straight lines between two vertices. They outline the shape.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="faces">
                        <div class="view"></div>
                        <figcaption><b>Faces</b>Flat surfaces closed in by edges. Faces are what render; the highlight steps through all 7.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="polygons">
                        <div class="view"></div>
                        <figcaption><b>Triangles, quads, n-gons</b>Faces can have any number of sides. Modelers prefer quads (4 sides); renderers split everything into triangles.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="low-poly">
                        <div class="view"></div>
                        <figcaption><b>Low poly</b>A sphere from 80 triangles. The facets show, but it is cheap to draw and easy to edit.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="high-poly">
                        <div class="view"></div>
                        <figcaption><b>High poly</b>The same sphere from 1,472 triangles. Smoother, but 18 times the data.</figcaption>
                    </figure>
                </div>
