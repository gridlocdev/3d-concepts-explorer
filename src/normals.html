<body>
    <div class="app-container">
        <aside class="sidebar">

        <main class="main-container">
            <article class="page">
                <h1>Normals</h1>
                <p class="lede">A normal is the direction a face points. Renderers use it to tell the front of a face from the back, and to work out how light falls on it.</p>
                <p class="hint">Drag a model to turn it.</p>
                <div class="spread">
                    <figure class="panel" data-panel="face-normals">
                        <div class="view"></div>
                        <figcaption><b>Face normals</b>One arrow per face, pointing straight out of it.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="vertex-normals">
                        <div class="view"></div>
                        <figcaption><b>Vertex normals</b>Each vertex can have its own normal, averaged from the faces around it. This is what makes smooth shading possible.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="backface">
                        <div class="view"></div>
                        <figcaption><b>Front and back</b>This square only draws its front. Turned away, it disappears.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="flipped">
                        <div class="view"></div>
                        <figcaption><b>A flipped face</b>One face points inward (orange arrow), so it draws from inside only and leaves a hole. Fix it with Flip Normals or Recalculate Normals.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="flat">
                        <div class="view"></div>
                        <figcaption><b>Flat shading</b>Each face uses its own normal, so every face is lit as one flat color.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="smooth">
                        <div class="view"></div>
                        <figcaption><b>Smooth shading</b>The same mesh with vertex normals. Light blends across faces and the sphere looks round. No faces were added.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="mixed">
                        <div class="view"></div>
                        <figcaption><b>Smooth with sharp edges</b>Smooth sides, sharp rims: the cap edges keep separate normals. Tools call this auto smooth or marking edges sharp.</figcaption>
                    </figure>
                </div>
