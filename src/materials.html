            <article class="page">
                <h1>Materials</h1>
                <p class="lede">A material says what a surface is made of. Most tools use physically based (PBR) materials, whose settings match real properties.</p>
                <p class="hint">Drag a model to turn it.</p>
                <div class="spread">
                    <figure class="panel wide" data-panel="roughness">
                        <div class="view"></div>
                        <figcaption><b>Roughness</b>From 0, a mirror finish, to 1, fully matte. The highlight spreads as roughness rises.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="metallic">
                        <div class="view"></div>
                        <figcaption><b>Metallic</b>The same orange, non-metal on the left and metal on the right. Metal tints its reflections; plastic keeps a white highlight.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="base-color">
                        <div class="view"></div>
                        <figcaption><b>Base color</b>The color of the surface itself, before any reflection.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="glass">
                        <div class="view"></div>
                        <figcaption><b>Transparent</b>Transmission lets light through and bends what is behind it, like glass.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="emission">
                        <div class="view"></div>
                        <figcaption><b>Emission</b>An emissive surface glows with its own color, no light needed.</figcaption>
                    </figure>
                    <figure class="panel wide" data-panel="real">
                        <div class="view"></div>
                        <figcaption><b>Real materials</b>Rubber, gold, chrome and clay, made only from color, roughness and metallic.</figcaption>
                    </figure>
                </div>
