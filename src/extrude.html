    <div class="app-container">

        <main class="main-container">
            <article class="page">
                <h1>Extrude</h1>
                <p class="lede">Extrude pulls a selected face, edge or vertex outward and fills the gap with new geometry joined to the old.</p>
                <p class="hint">Drag a model to turn it.</p>
                <div class="spread">
                    <figure class="panel wide" data-panel="face">
                        <div class="view"></div>
                        <figcaption><b>Extrude a face</b>The top face moves out along its normal, and a new side face fills each of its edges.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="steps">
                        <div class="view"></div>
                        <figcaption><b>Extrude, scale, repeat</b>Extrude the top, shrink the new face a little, extrude again. Four rounds make this tower.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="branch">
                        <div class="view"></div>
                        <figcaption><b>Extrude sideways</b>Any face can be extruded. Extrude a side face, then the top of the new part, and an arm grows.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="edge">
                        <div class="view"></div>
                        <figcaption><b>Extrude an edge</b>An extruded edge makes a new face. Good for fins, flanges and building walls from a floor outline.</figcaption>
                    </figure>
                    <figure class="panel" data-panel="vertex">
                        <div class="view"></div>
                        <figcaption><b>Extrude a vertex</b>An extruded vertex makes a new edge. Chains of them trace wires and branches.</figcaption>
                    </figure>
                </div>

                <h2>In your tool</h2>
                <ol>
                    <li>Select a face, edge or vertex.</li>
                    <li>Run Extrude.</li>
                    <li>Drag to set how far, or type a distance.</li>
                </ol>
