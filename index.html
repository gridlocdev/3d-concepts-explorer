<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blender Concepts Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            background: #1a1a1a;
            border-bottom: 2px solid #333;
        }

        .header h1 {
            margin: 0 0 20px 0;
            font-size: 28px;
            color: #00ff88;
        }

        .button-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .concept-button {
            padding: 10px 20px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .concept-button:hover {
            background: #444;
        }

        .concept-button.active {
            background: #00ff88;
            color: #000;
            font-weight: bold;
        }

        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .canvas-container {
            flex: 1;
            background: #1a1a1a;
            position: relative;
        }

        #three-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .info-panel {
            width: 400px;
            padding: 30px;
            background: #0f0f0f;
            overflow-y: auto;
            border-left: 2px solid #333;
        }

        .info-panel h2 {
            margin-top: 0;
            color: #00ff88;
            font-size: 24px;
        }

        .tldr-box {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #00ff88;
        }

        .tldr-box h3 {
            margin: 0 0 10px 0;
            color: #00ff88;
            font-size: 14px;
            text-transform: uppercase;
        }

        .tldr-box p {
            margin: 0;
            line-height: 1.6;
            font-size: 14px;
        }

        .explanation h3 {
            color: #00ff88;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .explanation p {
            line-height: 1.8;
            font-size: 14px;
            color: #ccc;
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }

            .info-panel {
                width: 100%;
                max-height: 50vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Blender Concepts Explorer</h1>
            <div class="button-container" id="button-container"></div>
        </div>

        <div class="main-content">
            <div class="canvas-container">
                <canvas id="three-canvas"></canvas>
            </div>

            <div class="info-panel">
                <h2 id="concept-name"></h2>
                <div class="tldr-box">
                    <h3>TL;DR</h3>
                    <p id="concept-tldr"></p>
                </div>
                <div class="explanation">
                    <h3>Detailed Explanation</h3>
                    <p id="concept-explanation"></p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from './node_modules/three/build/three.module.js';

        const concepts = [
            {
                name: "UV Maps",
                tldr: "UV maps unwrap 3D surfaces onto 2D space, allowing textures to be applied correctly to 3D models.",
                explanation: "UV mapping is the process of projecting a 2D texture onto a 3D model's surface. The 'U' and 'V' refer to the horizontal and vertical axes of the 2D texture space (different from X, Y, Z in 3D space). When you unwrap a 3D object, you're essentially cutting it and flattening it out like unfolding a cardboard box. Each vertex on your 3D mesh gets assigned UV coordinates (ranging from 0 to 1) that determine which part of the texture image gets mapped to that point. Good UV mapping ensures textures don't stretch or distort unnaturally on the model.",
                setupScene: (scene, camera) => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 512;
                    canvas.height = 512;
                    const ctx = canvas.getContext('2d');
                    
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, 512, 512);
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 2;
                    
                    for (let i = 0; i <= 8; i++) {
                        ctx.beginPath();
                        ctx.moveTo(i * 64, 0);
                        ctx.lineTo(i * 64, 512);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(0, i * 64);
                        ctx.lineTo(512, i * 64);
                        ctx.stroke();
                    }
                    
                    ctx.fillStyle = '#ff0000';
                    ctx.font = '24px Arial';
                    ctx.fillText('U →', 230, 30);
                    ctx.save();
                    ctx.translate(30, 280);
                    ctx.rotate(-Math.PI / 2);
                    ctx.fillText('V →', 0, 0);
                    ctx.restore();
                    
                    const texture = new THREE.CanvasTexture(canvas);
                    const geometry = new THREE.SphereGeometry(2, 32, 32);
                    const material = new THREE.MeshStandardMaterial({ map: texture });
                    const sphere = new THREE.Mesh(geometry, material);
                    scene.add(sphere);
                    
                    const light = new THREE.PointLight(0xffffff, 1, 100);
                    light.position.set(5, 5, 5);
                    scene.add(light);
                    
                    const ambientLight = new THREE.AmbientLight(0x404040);
                    scene.add(ambientLight);
                    
                    camera.position.z = 5;
                    
                    return () => {
                        sphere.rotation.y += 0.005;
                    };
                }
            },
            {
                name: "Materials",
                tldr: "Materials define how a surface interacts with light - its color, reflectivity, roughness, and other visual properties.",
                explanation: "In 3D graphics, a material determines how the surface of an object appears. It controls properties like base color, metalness (how metal-like it is), roughness (how smooth or rough the surface is), transparency, and emission (if it glows). Materials work with the lighting in your scene to create realistic appearances. For example, a plastic material might have low metalness and medium roughness, while a polished metal would have high metalness and low roughness. The material is what makes a sphere look like a rubber ball versus a chrome ball bearing, even though they're the same shape.",
                setupScene: (scene, camera) => {
                    const materials = [
                        new THREE.MeshStandardMaterial({ color: 0xff0000, roughness: 0.1, metalness: 0.9 }),
                        new THREE.MeshStandardMaterial({ color: 0x00ff00, roughness: 0.8, metalness: 0.2 }),
                        new THREE.MeshStandardMaterial({ color: 0x0000ff, roughness: 0.3, metalness: 0.0, transparent: true, opacity: 0.6 })
                    ];
                    
                    const geometry = new THREE.SphereGeometry(1, 32, 32);
                    const spheres = [];
                    
                    materials.forEach((material, index) => {
                        const sphere = new THREE.Mesh(geometry, material);
                        sphere.position.x = (index - 1) * 2.5;
                        scene.add(sphere);
                        spheres.push(sphere);
                    });
                    
                    const light = new THREE.PointLight(0xffffff, 1.5, 100);
                    light.position.set(5, 5, 5);
                    scene.add(light);
                    
                    const ambientLight = new THREE.AmbientLight(0x303030);
                    scene.add(ambientLight);
                    
                    camera.position.z = 6;
                    
                    return () => {
                        spheres.forEach(sphere => {
                            sphere.rotation.y += 0.01;
                        });
                    };
                }
            },
            {
                name: "Shaders",
                tldr: "Shaders are small programs that run on the GPU to calculate the final color of each pixel on a surface.",
                explanation: "Shaders are the actual code that runs on your graphics card to determine what each pixel looks like. There are two main types: vertex shaders (which process each point of the geometry) and fragment/pixel shaders (which determine the color of each pixel). While materials provide a user-friendly interface with sliders and color pickers, shaders are the underlying code that makes those materials work. Custom shaders allow you to create effects that go beyond standard materials - like animated patterns, special lighting effects, or stylized rendering. They're powerful but require programming knowledge.",
                setupScene: (scene, camera) => {
                    const vertexShader = `
                        varying vec3 vPosition;
                        void main() {
                            vPosition = position;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `;
                    
                    const fragmentShader = `
                        uniform float time;
                        varying vec3 vPosition;

                        void main() {
                            vec3 color1 = vec3(1.0, 0.0, 0.5);
                            vec3 color2 = vec3(0.0, 0.5, 1.0);

                            float pattern = sin(vPosition.x * 5.0 + time) * sin(vPosition.y * 5.0 + time) * sin(vPosition.z * 5.0 + time);
                            vec3 color = mix(color1, color2, pattern * 0.5 + 0.5);

                            gl_FragColor = vec4(color, 1.0);
                        }
                    `;
                    
                    const material = new THREE.ShaderMaterial({
                        vertexShader,
                        fragmentShader,
                        uniforms: {
                            time: { value: 0 }
                        }
                    });
                    
                    const geometry = new THREE.TorusKnotGeometry(1.5, 0.5, 100, 16);
                    const mesh = new THREE.Mesh(geometry, material);
                    scene.add(mesh);
                    
                    const light = new THREE.PointLight(0xffffff, 1, 100);
                    light.position.set(5, 5, 5);
                    scene.add(light);
                    
                    camera.position.z = 6;
                    
                    let time = 0;
                    return () => {
                        time += 0.01;
                        material.uniforms.time.value = time;
                        mesh.rotation.x += 0.005;
                        mesh.rotation.y += 0.01;
                    };
                }
            },
            {
                name: "Meshes",
                tldr: "A mesh is the fundamental 3D object made of vertices (points), edges (lines), and faces (polygons) that define its shape.",
                explanation: "A mesh is the core building block of 3D models. It's composed of vertices (individual points in 3D space), edges (lines connecting vertices), and faces (flat polygons, usually triangles or quads, formed by edges). Think of it like a wireframe skeleton that defines the shape of your object. The more vertices and faces a mesh has, the more detailed it can be, but also the more computational power it requires. Simple objects like cubes might have just 8 vertices and 6 faces, while complex character models can have thousands or millions. The mesh geometry is separate from its material - the same mesh could look like metal, plastic, or wood depending on its material.",
                setupScene: (scene, camera) => {
                    const geometry = new THREE.IcosahedronGeometry(1.5, 1);
                    
                    const solidMaterial = new THREE.MeshStandardMaterial({ color: 0x4488ff });
                    const solidMesh = new THREE.Mesh(geometry, solidMaterial);
                    solidMesh.position.x = -2;
                    scene.add(solidMesh);
                    
                    const wireframeMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
                    const wireframeMesh = new THREE.Mesh(geometry, wireframeMaterial);
                    wireframeMesh.position.x = 2;
                    scene.add(wireframeMesh);
                    
                    const vertices = geometry.attributes.position;
                    const pointsGeometry = new THREE.BufferGeometry();
                    pointsGeometry.setAttribute('position', vertices);
                    const pointsMaterial = new THREE.PointsMaterial({ color: 0xff0000, size: 0.1 });
                    const points = new THREE.Points(pointsGeometry, pointsMaterial);
                    points.position.x = 2;
                    scene.add(points);
                    
                    const light = new THREE.PointLight(0xffffff, 1, 100);
                    light.position.set(5, 5, 5);
                    scene.add(light);
                    
                    const ambientLight = new THREE.AmbientLight(0x404040);
                    scene.add(ambientLight);
                    
                    camera.position.z = 6;
                    
                    return () => {
                        solidMesh.rotation.x += 0.01;
                        solidMesh.rotation.y += 0.01;
                        wireframeMesh.rotation.x += 0.01;
                        wireframeMesh.rotation.y += 0.01;
                        points.rotation.x += 0.01;
                        points.rotation.y += 0.01;
                    };
                }
            },
            {
                name: "Subdivision Surface (Subdivs)",
                tldr: "Subdivision surface smooths a mesh by splitting each face into smaller faces, creating organic curved surfaces from blocky geometry.",
                explanation: "Subdivision surface (often called 'SubDiv' or 'Subsurf') is a modifier that takes a simple, low-polygon mesh and automatically generates a much smoother, higher-resolution version. It works by subdividing each face into multiple smaller faces and smoothing the result. This is incredibly useful because you can model with simple, easy-to-manipulate geometry, then add subdivision to get smooth organic shapes. Each subdivision level typically quadruples the face count (2 subdivisions = 16x faces), so it can get very heavy quickly. The beauty is that you keep the simple 'cage' mesh for editing while getting smooth results. It's essential for character modeling and any organic shapes.",
                setupScene: (scene, camera) => {
                    const baseGeometry = new THREE.BoxGeometry(2, 2, 2);
                    
                    const lowPolyMaterial = new THREE.MeshStandardMaterial({ 
                        color: 0xff6600,
                        flatShading: true
                    });
                    const lowPolyMesh = new THREE.Mesh(baseGeometry, lowPolyMaterial);
                    lowPolyMesh.position.x = -2.5;
                    scene.add(lowPolyMesh);
                    
                    const subdividedGeometry = new THREE.SphereGeometry(1.4, 32, 32);
                    const subdividedMaterial = new THREE.MeshStandardMaterial({ 
                        color: 0x00ff88
                    });
                    const subdividedMesh = new THREE.Mesh(subdividedGeometry, subdividedMaterial);
                    subdividedMesh.position.x = 2.5;
                    scene.add(subdividedMesh);
                    
                    const wireGeometry = subdividedGeometry.clone();
                    const wireMaterial = new THREE.MeshBasicMaterial({ 
                        color: 0xffffff, 
                        wireframe: true,
                        transparent: true,
                        opacity: 0.3
                    });
                    const wireMesh = new THREE.Mesh(wireGeometry, wireMaterial);
                    wireMesh.position.x = 2.5;
                    scene.add(wireMesh);
                    
                    const light = new THREE.PointLight(0xffffff, 1.5, 100);
                    light.position.set(5, 5, 5);
                    scene.add(light);
                    
                    const ambientLight = new THREE.AmbientLight(0x404040);
                    scene.add(ambientLight);
                    
                    camera.position.z = 7;
                    
                    return () => {
                        lowPolyMesh.rotation.x += 0.01;
                        lowPolyMesh.rotation.y += 0.01;
                        subdividedMesh.rotation.x += 0.01;
                        subdividedMesh.rotation.y += 0.01;
                        wireMesh.rotation.x += 0.01;
                        wireMesh.rotation.y += 0.01;
                    };
                }
            }
        ];

        // State
        let currentConceptIndex = 0;
        let scene, camera, renderer;
        let animationId;
        let currentUpdateFunc = null;

        // Initialize Three.js
        function initThree() {
            const canvas = document.getElementById('three-canvas');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            camera = new THREE.PerspectiveCamera(
                75,
                canvas.clientWidth / canvas.clientHeight,
                0.1,
                1000
            );

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);

            window.addEventListener('resize', handleResize);
        }

        function handleResize() {
            const canvas = document.getElementById('three-canvas');
            camera.aspect = canvas.clientWidth / canvas.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        }

        // Clear scene
        function clearScene() {
            while(scene.children.length > 0) { 
                scene.remove(scene.children[0]); 
            }
        }

        // Load concept
        function loadConcept(index) {
            currentConceptIndex = index;
            const concept = concepts[index];

            // Update UI
            document.getElementById('concept-name').textContent = concept.name;
            document.getElementById('concept-tldr').textContent = concept.tldr;
            document.getElementById('concept-explanation').textContent = concept.explanation;

            // Update buttons
            document.querySelectorAll('.concept-button').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });

            // Clear and setup new scene
            clearScene();
            currentUpdateFunc = concept.setupScene(scene, camera);
        }

        // Animation loop
        function animate() {
            animationId = requestAnimationFrame(animate);
            if (currentUpdateFunc) {
                currentUpdateFunc();
            }
            renderer.render(scene, camera);
        }

        // Initialize buttons
        function initButtons() {
            const container = document.getElementById('button-container');
            concepts.forEach((concept, index) => {
                const button = document.createElement('button');
                button.className = 'concept-button';
                button.textContent = concept.name;
                button.addEventListener('click', () => loadConcept(index));
                container.appendChild(button);
            });
        }

        // Initialize everything
        initThree();
        initButtons();
        loadConcept(0);
        animate();
    </script>
</body>
</html>
